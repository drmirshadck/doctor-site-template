# TEST ONLY: Starter own calendar on arshees.com/samples/dotcom-calendar-starter-test/
# Deployed by Cloudflare Workers Builds from branch own-calendar with:  npx wrangler deploy -c wrangler.test.toml  (root /worker)
name = "dotcom-by-arshees-calendar-test-starter"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true          # a deploy never removes values added in the Cloudflare dashboard

[vars]
PLAN = "starter"
ALLOWED_ORIGINS = "https://arshees.com,https://www.arshees.com"
CALENDAR = "own"
TIMEZONE = "Asia/Kolkata"
RETAIN_DAYS = "365"
CHANGE_CUTOFF_HOURS = "2"
DOCTOR_NAME = "Dr. Starter Sample"
DOCTOR_EMAIL = "godigital@arshees.com"
EMAIL_PROVIDER = "zeptomail"
EMAIL_FROM = "yourbooking@arshees.com"
ZEPTO_HOST = "cpaas.zoho.com"
CLINIC_NAME = "Starter Test Clinic"
SITE_URL = "https://arshees.com/samples/dotcom-calendar-starter-test/"
SCHEDULE_JSON = '''{"week":{"1":[["08:00","12:00"],["16:00","20:00"]],"2":[["08:00","12:00"],["16:00","20:00"]],"3":[["08:00","12:00"],["16:00","20:00"]],"4":[["08:00","12:00"],["16:00","20:00"]],"5":[["08:00","12:00"],["16:00","20:00"]],"6":[["08:00","12:00"],["16:00","20:00"]],"0":[]},"gap":10,"notice":2,"ahead":30,"types":{"online-video-consultation":{"name":"New consultation","length":30,"confirm":true,"fee":500},"review-consultation":{"name":"Review consultation","length":20,"confirm":true,"fee":300}}}'''

[[durable_objects.bindings]]
name = "CALS"
class_name = "Calendar"

[[durable_objects.bindings]]
name = "ROOMS"          # own video: one room per consultation (connection messages only, nothing stored)
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Calendar"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "PUSH"
id = "5615443fa66d4328b3606c63f3fae2fa"
# Secrets: PIN_HASH, SESSION_SECRET, DATA_KEY, ZEPTO_TOKEN
